<div class="overlay" id="prac-modal">
  <div class="modal">
    <div class="mhead">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span class="tag tc" id="m-num">—</span>
          <span id="m-diff" style="color:var(--aw);font-size:13px"></span>
        </div>
        <div style="font-family:var(--head);font-weight:700;font-size:1.2rem" id="m-title">—</div>
        <div style="color:var(--td);font-size:13px;margin-top:4px" id="m-obj">—</div>
      </div>
      <button class="mclose" onclick="closeModal()">✕ Cerrar</button>
    </div>
    <div class="mbody">
      <div>
        <h3>🔩 Checklist de Componentes</h3>
        <div style="font-size:12px;color:var(--td);margin-bottom:8px;font-family:var(--mono)">Identifica cada pieza en el módulo antes de comenzar</div>
        <div class="chk" id="m-checklist"></div>
      </div>
      <div>
        <h3>⚡ Diagrama de Conexión</h3>
        <div class="circuit" id="m-circuit"></div>
      </div>
      <div>
        <h3>📋 Pasos</h3>
        <div style="display:flex;flex-direction:column;gap:8px" id="m-steps"></div>
      </div>
      <div id="m-code-wrap">
        <h3>💾 Código Arduino</h3>
        <div id="m-code" style="background:#020912;border-radius:6px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.9;white-space:pre-wrap"></div>
      </div>
    </div>
  </div>
</div>
