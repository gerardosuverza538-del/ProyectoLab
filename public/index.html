<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electro-Lab Digital — IPN</title>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div id="login-container"></div>

  <div id="app">
    <div id="nav-container"></div>

    <div class="main">
      <div id="sidebars-container"></div>

      <div class="content">
        <div id="student-pages-container"></div>
        <div id="teacher-pages-container"></div>
        <div id="hardware-pages-container"></div>
      </div>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>

    // Compatibilidad:
    // Como esta versión carga fragmentos HTML antes de cargar JS,
    // algunos archivos antiguos que usen DOMContentLoaded aún deben ejecutarse.
    (function patchDOMContentLoaded() {
      const docAdd = document.addEventListener.bind(document);
      document.addEventListener = function(type, callback, options) {
        if (type === 'DOMContentLoaded' && document.readyState !== 'loading') {
          setTimeout(() => callback.call(document, new Event('DOMContentLoaded')), 0);
        }
        return docAdd(type, callback, options);
      };

      const winAdd = window.addEventListener.bind(window);
      window.addEventListener = function(type, callback, options) {
        if (type === 'DOMContentLoaded' && document.readyState !== 'loading') {
          setTimeout(() => callback.call(window, new Event('DOMContentLoaded')), 0);
        }
        return winAdd(type, callback, options);
      };
    })();

    async function loadHTML(targetId, file) {
      const res = await fetch(file);
      if (!res.ok) throw new Error(`No se pudo cargar ${file}`);
      const html = await res.text();
      document.getElementById(targetId).insertAdjacentHTML('beforeend', html);
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`No se pudo cargar ${src}`));
        document.body.appendChild(script);
      });
    }

    async function bootElectroLab() {
      await Promise.all([
        loadHTML('login-container', 'html/login.html'),
        loadHTML('nav-container', 'html/nav.html'),
        loadHTML('sidebars-container', 'html/sidebar-student.html'),
        loadHTML('sidebars-container', 'html/sidebar-teacher.html'),
        loadHTML('sidebars-container', 'html/sidebar-hardware.html'),
        loadHTML('student-pages-container', 'html/student-pages.html'),
        loadHTML('teacher-pages-container', 'html/teacher-pages.html'),
        loadHTML('hardware-pages-container', 'html/hardware-pages.html'),
        loadHTML('modal-container', 'html/modal.html')
      ]);

      const scripts = [
        'js/utils.js',
        'js/config.js',
        'js/api.js',
        'js/state.js',
        'js/actions.js',
        'js/files.js',
        'js/quiz.js',
        'js/render.js',
        'js/editor.js',
        'js/main.js',
        'js/ui.js'
      ];

      for (const src of scripts) {
        await loadScript(src);
      }
    }

    bootElectroLab().catch(err => {
      console.error(err);
      document.body.insertAdjacentHTML(
        'afterbegin',
        `<div style="padding:12px;background:#7f1d1d;color:white;font-family:monospace;position:fixed;z-index:9999;inset:0 auto auto 0">
          Error cargando la interfaz: ${err.message}
        </div>`
      );
    });
  </script>
</body>
</html>
